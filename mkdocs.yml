site_name: Zscode
site_description: Zect（Zscode）のポートフォリオ。ボカロ系クラブイベントを中心に活動する VJ・エンジニア。VJ 出演履歴と、VJ ソフト・Web・Unity・Discord Bot などの制作物。
site_author: Zect
site_url: https://zscode.net/

extra:
    person:
        name: Zect
        alternate_name: Zscode
        job_title: [VJ, エンジニア]
        same_as:
            - https://github.com/Zect3279
            - https://linktr.ee/zect3279
            - https://zect.booth.pm/

theme:
    name: material
    custom_dir: overrides
    palette:
        scheme: default
        primary: custom
        accent: custom
    font:
        text: Noto Sans
    language: ja
    # logo: img/
    # favicon: img/
    icon:
        repo: fontawesome/brands/github
    # features:
        # - navigation.indexes

markdown_extensions:
    - toc:
        permalink: true
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight
    - pymdownx.inlinehilite
    - pymdownx.tabbed
    - footnotes
    - pymdownx.emoji:
        emoji_index: !!python/name:materialx.emoji.twemoji
        emoji_generator: !!python/name:materialx.emoji.to_svg
    - pymdownx.arithmatex:
        generic: true
    - meta

extra_css:
    - stylesheets/extra.css

hooks:
    - hooks/works.py

site_name: Zscode
site_description: Zscode の Web サイト。VJ・ライブ制作の活動と、Web・Unity・Discord Bot などのプロジェクトを紹介しています。
site_author: Z
site_url: https://zscode.net/


nav:
    - Home: index.md
    - Works: works.md

# イベント・シリーズのページ（hooks/works.py が生成）はナビに出さない
not_in_nav: |
    /works/

theme:
    name: material
    custom_dir: overrides
    palette:
        scheme: default
        primary: custom
        accent: custom
    font:
        text: Noto Sans
    language: ja
    # logo: img/
    # favicon: img/
    icon:
        repo: fontawesome/brands/github
    # features:
        # - navigation.indexes

markdown_extensions:
    - toc:
        permalink: true
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight
    - pymdownx.inlinehilite
    - pymdownx.tabbed
    - footnotes
    - pymdownx.emoji:
        emoji_index: !!python/name:materialx.emoji.twemoji
        emoji_generator: !!python/name:materialx.emoji.to_svg
    - pymdownx.arithmatex:
        generic: true
    - meta

extra_css:
    - stylesheets/extra.css

hooks:
    - hooks/works.py
